<!DOCTYPE html>
<html lang="en" dir="ltr">

<head>
    <meta charset="UTF-8">
    <title>RealVision — Deepfake Detection</title>
    <style>
        :root {
            --navy: #101828;
            --blue: #2563eb;
            --blue-dark: #1d4ed8;
            --green: #15803d;
            --green-bg: #e7f9ee;
            --red: #dc2626;
            --red-bg: #fdeaea;
            --muted: #667085;
            --glass: rgba(255, 255, 255, 0.62);
            --glass-border: rgba(255, 255, 255, 0.8);
        }

        * {
            box-sizing: border-box;
        }

        body {
            font-family: system-ui, sans-serif;
            max-width: 1120px;
            margin: 0 auto;
            padding: 36px 32px 60px;
            color: var(--navy);
            min-height: 100vh;
            background-image: url("images/background.png");
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
        }

        /* Header row: logo + home pill */
        .header-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 48px;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .brand svg {
            width: 30px;
            height: 30px;
            color: var(--blue);
            flex-shrink: 0;
        }

        .brand .wordmark {
            font-size: 21px;
            font-weight: 800;
            letter-spacing: -0.3px;
        }

        .brand .wordmark .accent {
            color: var(--blue);
        }

        .home-pill {
            padding: 9px 20px;
            border-radius: 999px;
            background: rgba(255, 255, 255, 0.7);
            border: 1px solid rgba(255, 255, 255, 0.9);
            color: var(--navy);
            font-size: 13.5px;
            font-weight: 600;
            text-decoration: none;
        }

        /* Two-column hero layout */
        .hero {
            display: grid;
            grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
            gap: 56px;
            align-items: center;
        }

        @media (max-width: 860px) {
            .hero {
                grid-template-columns: 1fr;
                gap: 32px;
            }
        }

        .hero-text .eyebrow-hero {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 12px;
            font-weight: 700;
            letter-spacing: 1.4px;
            color: var(--muted);
            text-transform: uppercase;
            margin-bottom: 18px;
        }

        .hero-text .eyebrow-hero::after {
            content: "";
            display: inline-block;
            width: 34px;
            height: 1px;
            background: var(--muted);
            opacity: 0.5;
        }

        .hero-title {
            font-size: 52px;
            line-height: 1.08;
            font-weight: 800;
            letter-spacing: -1px;
            margin: 0 0 20px;
        }

        .hero-title .accent {
            color: var(--blue);
        }

        .hero-subtitle {
            font-size: 16px;
            color: var(--muted);
            max-width: 380px;
            line-height: 1.6;
        }

        @media (max-width: 860px) {
            .hero-title {
                font-size: 38px;
            }
        }

        /* Glass card */
        .card {
            background: var(--glass);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            border-radius: 22px;
            padding: 30px;
            box-shadow: 0 12px 32px rgba(20, 30, 60, 0.08);
        }

        /* Dropzone */
        .dropzone {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            border: 1.5px dashed rgba(37, 99, 235, 0.3);
            border-radius: 16px;
            padding: 34px 16px;
            text-align: center;
            cursor: pointer;
            background: rgba(255, 255, 255, 0.4);
            transition: border-color 0.2s, background 0.2s;
        }

        .dropzone:hover,
        .dropzone.dragover {
            border-color: var(--blue);
            background: rgba(37, 99, 235, 0.06);
        }

        .dropzone .icon-circle {
            width: 52px;
            height: 52px;
            border-radius: 14px;
            background: white;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 12px rgba(20, 30, 60, 0.08);
            color: var(--navy);
        }

        .dropzone .icon-circle svg {
            width: 24px;
            height: 24px;
        }

        .dropzone .title {
            font-weight: 600;
            font-size: 16px;
            margin-top: 4px;
        }

        .dropzone .hint {
            font-size: 12.5px;
            color: var(--muted);
        }

        input[type="file"] {
            display: none;
        }

        /* Pill buttons */
        button {
            width: 100%;
            margin-top: 18px;
            padding: 13px;
            border: none;
            border-radius: 999px;
            background: var(--navy);
            color: white;
            font-size: 14.5px;
            font-weight: 600;
            cursor: pointer;
            transition: opacity 0.15s, transform 0.1s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        #resetBtn {
            width: auto;
            min-width: 220px;
            margin: 24px auto 0;
            padding: 12px 22px;
            font-size: 14px;
        }

        #resetBtn svg {
            width: 16px;
            height: 16px;
            flex-shrink: 0;
        }

        button:active {
            transform: scale(0.98);
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .spinner {
            width: 14px;
            height: 14px;
            border: 2px solid rgba(255, 255, 255, 0.4);
            border-top-color: white;
            border-radius: 50%;
            animation: spin 0.7s linear infinite;
            display: none;
        }

        button.loading .spinner {
            display: inline-block;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        /* Result section */
        #resultHero {
            display: none;
            animation: fadeIn 0.35s ease;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(8px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .video-box {
            border-radius: 18px;
            overflow: hidden;
            box-shadow: 0 12px 32px rgba(20, 30, 60, 0.12);
            background: #000;
        }

        .video-box video {
            display: block;
            width: 100%;
            max-height: 420px;
        }

        .eyebrow {
            font-size: 11.5px;
            font-weight: 700;
            letter-spacing: 1.2px;
            color: var(--muted);
            text-transform: uppercase;
            margin-bottom: 14px;
        }

        .verdict-badge {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 16px 18px;
            border-radius: 14px;
            font-size: 22px;
            font-weight: 800;
        }

        .verdict-badge svg {
            width: 26px;
            height: 26px;
            flex-shrink: 0;
        }

        .verdict-badge.real {
            background: var(--green-bg);
            color: var(--green);
        }

        .verdict-badge.fake {
            background: var(--red-bg);
            color: var(--red);
        }

        .confidence-line {
            margin-top: 16px;
            font-size: 15px;
        }

        .confidence-line b {
            font-weight: 800;
        }

        .divider {
            border: none;
            border-top: 1px solid rgba(16, 24, 40, 0.08);
            margin: 20px 0;
        }

        .meta-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
        }

        .meta-item {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .meta-item svg {
            width: 17px;
            height: 17px;
            color: var(--muted);
            flex-shrink: 0;
        }

        .meta-item .meta-label {
            font-size: 11.5px;
            color: var(--muted);
        }

        .meta-item .meta-value {
            font-size: 13.5px;
            font-weight: 600;
            word-break: break-all;
        }

        .error {
            color: var(--red);
            margin-top: 16px;
            text-align: center;
            font-size: 13.5px;
        }
    </style>
</head>

<body>

    <div class="header-row">
        <div class="brand">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"
                stroke-linejoin="round">
                <path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7Z" />
                <circle cx="12" cy="12" r="3.2" />
            </svg>
            <span class="wordmark">Real<span class="accent">Vision</span></span>
        </div>
        <a href="/" class="home-pill">Home</a>
    </div>

    <!-- Upload hero -->
    <div class="hero" id="uploadHero">
        <div class="hero-text">
            <div class="eyebrow-hero">Deepfake Detection</div>
            <h1 class="hero-title">Detect<br><span class="accent">Deepfakes</span></h1>
            <p class="hero-subtitle">Upload a video and let AI detect signs of manipulation.</p>
        </div>

        <div class="card" id="uploadCard">
            <label class="dropzone" id="dropzone">
                <span class="icon-circle">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"
                        stroke-linejoin="round">
                        <path d="M7 16a4 4 0 0 1-.88-7.9A5 5 0 0 1 15.9 6H16a4 4 0 0 1 1 7.87" />
                        <path d="M12 12v6" />
                        <path d="m9 15 3-3 3 3" />
                    </svg>
                </span>
                <span class="title" id="filename">Upload a video</span>
                <span class="hint">Drag &amp; drop or click to browse — MP4, MOV up to 20MB</span>
                <input type="file" id="videoInput" accept="video/*">
            </label>

            <button id="predictBtn">
                <span class="spinner"></span>
                <span id="btnText">Analyze Video</span>
            </button>

            <div id="error" class="error"></div>
        </div>
    </div>

    <!-- Result hero -->
    <div class="hero" id="resultHero">
        <div class="video-box">
            <video id="previewVideo" controls playsinline></video>
        </div>

        <div class="card" id="resultCard">
            <div class="eyebrow">Analysis Result</div>

            <div class="verdict-badge" id="verdictBadge">
                <svg id="verdictIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                    stroke-linecap="round" stroke-linejoin="round"></svg>
                <span id="verdictText"></span>
            </div>

            <div class="confidence-line">Confidence: <b id="confidenceValue"></b></div>

            <hr class="divider">

            <div class="meta-grid">
                <div class="meta-item">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"
                        stroke-linejoin="round">
                        <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z" />
                        <path d="M14 2v6h6" />
                    </svg>
                    <div>
                        <div class="meta-label">File name</div>
                        <div class="meta-value" id="metaName">—</div>
                    </div>
                </div>
                <div class="meta-item">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"
                        stroke-linejoin="round">
                        <circle cx="12" cy="12" r="9" />
                        <path d="M12 7v5l3 2" />
                    </svg>
                    <div>
                        <div class="meta-label">Duration</div>
                        <div class="meta-value" id="metaDuration">—</div>
                    </div>
                </div>
                <div class="meta-item">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"
                        stroke-linejoin="round">
                        <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z" />
                        <path d="M14 2v6h6" />
                    </svg>
                    <div>
                        <div class="meta-label">File type</div>
                        <div class="meta-value" id="metaType">—</div>
                    </div>
                </div>
                <div class="meta-item">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"
                        stroke-linejoin="round">
                        <ellipse cx="12" cy="5" rx="8" ry="3" />
                        <path d="M4 5v14c0 1.66 3.58 3 8 3s8-1.34 8-3V5" />
                        <path d="M4 12c0 1.66 3.58 3 8 3s8-1.34 8-3" />
                    </svg>
                    <div>
                        <div class="meta-label">File size</div>
                        <div class="meta-value" id="metaSize">—</div>
                    </div>
                </div>
            </div>

            <button id="resetBtn">
                Analyze another video
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                    stroke-linejoin="round">
                    <path d="M19 12H5" />
                    <path d="m12 19-7-7 7-7" />
                </svg>
            </button>
        </div>
    </div>

    <script>
        const dropzone = document.getElementById("dropzone");
        const videoInput = document.getElementById("videoInput");
        const filenameLabel = document.getElementById("filename");
        const predictBtn = document.getElementById("predictBtn");
        const btnText = document.getElementById("btnText");
        const errorBox = document.getElementById("error");

        const uploadHero = document.getElementById("uploadHero");
        const resultHero = document.getElementById("resultHero");
        const previewVideo = document.getElementById("previewVideo");
        const verdictBadge = document.getElementById("verdictBadge");
        const verdictIcon = document.getElementById("verdictIcon");
        const verdictText = document.getElementById("verdictText");
        const confidenceValue = document.getElementById("confidenceValue");
        const metaName = document.getElementById("metaName");
        const metaDuration = document.getElementById("metaDuration");
        const metaType = document.getElementById("metaType");
        const metaSize = document.getElementById("metaSize");
        const resetBtn = document.getElementById("resetBtn");

        const ICON_WARNING = '<path d="m21.7 18-8-14a2 2 0 0 0-3.4 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.7-3Z"/><path d="M12 9v4"/><path d="M12 17h.01"/>';
        const ICON_CHECK = '<circle cx="12" cy="12" r="10"/><path d="m9 12 2 2 4-4"/>';

        let currentDuration = null;
        let previewObjectUrl = null;

        function formatBytes(bytes) {
            return (bytes / (1024 * 1024)).toFixed(1) + " MB";
        }

        function formatDuration(seconds) {
            if (seconds === null || isNaN(seconds)) return "—";
            const m = Math.floor(seconds / 60);
            const s = Math.floor(seconds % 60).toString().padStart(2, "0");
            return m + ":" + s;
        }

        function readDuration(file) {
            return new Promise((resolve) => {
                const v = document.createElement("video");
                v.preload = "metadata";
                v.onloadedmetadata = () => {
                    URL.revokeObjectURL(v.src);
                    resolve(v.duration);
                };
                v.onerror = () => resolve(null);
                v.src = URL.createObjectURL(file);
            });
        }

        async function handleFile(file) {
            if (!file) return;
            filenameLabel.textContent = file.name;
            currentDuration = await readDuration(file);
        }

        const DEFAULT_FILENAME_LABEL = "Upload a video";

        videoInput.addEventListener("change", () => {
            handleFile(videoInput.files[0]);
        });

        ["dragover", "dragenter"].forEach((eventName) => {
            dropzone.addEventListener(eventName, (e) => {
                e.preventDefault();
                dropzone.classList.add("dragover");
            });
        });

        ["dragleave", "drop"].forEach((eventName) => {
            dropzone.addEventListener(eventName, (e) => {
                e.preventDefault();
                dropzone.classList.remove("dragover");
            });
        });

        dropzone.addEventListener("drop", (e) => {
            const file = e.dataTransfer.files[0];
            if (file) {
                videoInput.files = e.dataTransfer.files;
                handleFile(file);
            }
        });

        predictBtn.addEventListener("click", async () => {
            const file = videoInput.files[0];

            errorBox.textContent = "";

            if (!file) {
                errorBox.textContent = "Please select a video first";
                return;
            }

            const formData = new FormData();
            formData.append("video", file);

            predictBtn.disabled = true;
            predictBtn.classList.add("loading");
            btnText.textContent = "Analyzing...";

            try {
                const response = await fetch("/api/predict", {
                    method: "POST",
                    body: formData
                });

                const data = await response.json();

                if (!response.ok) {
                    throw new Error(data.error || "Analysis failed");
                }

                const isFake = data.prediction === "fake";
                const confidencePct = Math.round(data.confidence * 100) + "%";

                verdictBadge.className = "verdict-badge " + (isFake ? "fake" : "real");
                verdictIcon.innerHTML = isFake ? ICON_WARNING : ICON_CHECK;
                verdictText.textContent = isFake ? "Fake" : "Real";
                confidenceValue.textContent = confidencePct;

                metaName.textContent = file.name;
                metaDuration.textContent = formatDuration(currentDuration);
                metaType.textContent = (file.type || "video").split("/")[1]?.toUpperCase() || "—";
                metaSize.textContent = formatBytes(file.size);

                previewObjectUrl = URL.createObjectURL(file);
                previewVideo.src = previewObjectUrl;

                uploadHero.style.display = "none";
                resultHero.style.display = "grid";

            } catch (error) {
                errorBox.textContent = error.message;

            } finally {
                predictBtn.disabled = false;
                predictBtn.classList.remove("loading");
                btnText.textContent = "Analyze Video";
            }
        });

        resetBtn.addEventListener("click", () => {
            videoInput.value = "";
            currentDuration = null;
            filenameLabel.textContent = DEFAULT_FILENAME_LABEL;
            errorBox.textContent = "";

            previewVideo.pause();
            previewVideo.removeAttribute("src");
            previewVideo.load();
            if (previewObjectUrl) {
                URL.revokeObjectURL(previewObjectUrl);
                previewObjectUrl = null;
            }

            resultHero.style.display = "none";
            uploadHero.style.display = "grid";
        });
    </script>

</body>

</html>
